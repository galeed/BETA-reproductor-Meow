<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reproductor PWA</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- SVG limpio para escalabilidad -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600'%3E%3Cpath fill='%23000' d='M2820 5784c-14-2-65-9-115-15C1874 5654 1115 5160 675 4435 272 3770 166 2965 382 2215c249-866 920-1569 1778-1862 336-115 713-164 1074-140 226 15 488 62 651 117 189 64 229 81 431 181 640 318 1139 889 1375 1573 63 183 98 328 130 546 22 140 19 609-4 755-95 607-363 1145-777 1560-130 130-178 173-305 269-22 17-44 34-50 39-44 34-228 148-305 189-436 230-860 335-1335 332-110-1-211-3-225-5z'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #00e5ff;
      --text: #ffffff;
      --subtext: #a0a0b0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: var(--card);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s ease;
      margin-bottom: 1.5rem;
    }

    .btn:active {
      opacity: 0.8;
    }

    audio {
      width: 100%;
      margin-top: 1rem;
      border-radius: 10px;
    }

    .file-info {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-top: 0.5rem;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Reproductor Local PWA</h1>
    
    <label for="audioFile" class="btn">Cargar Pista Audio</label>
    <input type="file" id="audioFile" accept="audio/*">

    <div id="fileName" class="file-info">Ninguna pista seleccionada</div>

    <audio id="audioPlayer" controls playsinline></audio>
  </div>

  <script>
    // Registro de Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW registrado correctamente:', reg.scope))
          .catch((err) => console.error('Error al registrar SW:', err));
      });
    }

    const audioFileInput = document.getElementById('audioFile');
    const audioPlayer = document.getElementById('audioPlayer');
    const fileNameDisplay = document.getElementById('fileName');
    let currentBlobUrl = null;

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Liberar URL previa de la memoria RAM
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }

      currentBlobUrl = URL.createObjectURL(file);
      audioPlayer.src = currentBlobUrl;
      fileNameDisplay.textContent = file.name;

      // Configurar metadatos en MediaSession para reproducción en segundo plano y pantalla de bloqueo
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Archivo Local",
          album: "Reproducción en Segundo Plano"
        });

        navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
        navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
        navigator.mediaSession.setActionHandler('seekbackward', (details) => {
          audioPlayer.currentTime = Math.max(audioPlayer.currentTime - (details.seekOffset || 10), 0);
        });
        navigator.mediaSession.setActionHandler('seekforward', (details) => {
          audioPlayer.currentTime = Math.min(audioPlayer.currentTime + (details.seekOffset || 10), audioPlayer.duration);
        });
      }

      audioPlayer.play().catch((err) => console.log("Autoplay bloqueado o interactuado por el usuario:", err));
    });
  </script>
</body>
</html>
